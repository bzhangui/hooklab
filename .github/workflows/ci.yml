name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooklab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooklab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install platform adapter dependencies
        run: npm ci --ignore-scripts
      - name: Check locked dependency license metadata
        run: node scripts/check-dependency-licenses.mjs
      - name: Toolchain
        run: moon version --all
      - name: Require moonc 0.10.14 or newer
        run: node scripts/check-moonc-version.mjs
      - name: Reject unreviewed toolchain drift
        run: node scripts/check-toolchain-lock.mjs
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: MoonBit core coverage floor
        run: node scripts/check-core-coverage.mjs
      - name: Build
        run: moon build --target all --deny-warn
      - name: Verify Mooncakes archive excludes private files
        run: node scripts/check-package-contents.mjs
      - name: CLI demo
        timeout-minutes: 2
        run: bash scripts/demo.sh
      - name: Gateway delivery E2E
        timeout-minutes: 2
        run: node scripts/gateway-e2e.mjs
      - name: Gateway configuration E2E
        timeout-minutes: 2
        run: node scripts/gateway-config-e2e.mjs
      - name: Gateway dead-letter E2E
        timeout-minutes: 2
        run: node scripts/gateway-deadletter-e2e.mjs
      - name: Gateway limits E2E
        timeout-minutes: 2
        run: node scripts/gateway-limits-e2e.mjs
      - name: Gateway circuit E2E
        timeout-minutes: 2
        run: node scripts/gateway-circuit-e2e.mjs
      - name: Gateway restart E2E
        timeout-minutes: 2
        run: node scripts/gateway-restart-e2e.mjs
      - name: Gateway outbound publication E2E
        timeout-minutes: 2
        run: node scripts/gateway-outbound-e2e.mjs
      - name: Gateway worker lease E2E
        timeout-minutes: 2
        run: node scripts/gateway-lease-e2e.mjs
      - name: Platform unit tests
        run: npm run test:platform
      - name: Platform deterministic helper coverage floor
        run: npm run test:platform:coverage
      - name: Parse machine-readable API description
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/openapi.json','utf8'))"
      - name: PostgreSQL multi-worker E2E
        timeout-minutes: 3
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hooklab_test
        run: node scripts/platform-e2e.mjs
      - name: PostgreSQL cross-instance quota E2E
        timeout-minutes: 2
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hooklab_test
        run: node scripts/platform-quota-e2e.mjs
      - name: PostgreSQL failover showcase
        timeout-minutes: 2
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hooklab_test
        run: node scripts/platform-showcase.mjs

  registry-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install and call published package from a fresh project
        run: node scripts/mooncakes-smoke.mjs 0.3.0-rc.5
      - name: Reject unreviewed toolchain drift
        run: node scripts/check-toolchain-lock.mjs

  simulated-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooklab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooklab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install platform adapter dependencies
        run: npm ci --ignore-scripts
      - name: Run disposable multi-persona acceptance
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hooklab_test
        run: node scripts/simulated-pilot.mjs --profile full --repeat 3
      - name: Upload synthetic-only summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulated-pilot-summary
          path: target/simulated-pilot-report.json
          if-no-files-found: warn

  windows-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin" -Encoding utf8
      - name: Check toolchain and install dependencies
        shell: pwsh
        run: |
          moon version --all
          node scripts/check-moonc-version.mjs
          node scripts/check-toolchain-lock.mjs
          npm ci --ignore-scripts
          node scripts/check-dependency-licenses.mjs
      - name: Check, test and build MoonBit on Windows
        shell: pwsh
        run: |
          moon fmt --check
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon build --target all --deny-warn
      - name: Run PowerShell CLI demo
        shell: pwsh
        run: ./scripts/demo.ps1
      - name: Run Node.js adapter tests
        run: npm run test:platform
      - name: Platform deterministic helper coverage floor
        run: npm run test:platform:coverage

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse example TLS edge configuration
        run: |
          set -euo pipefail
          certdir="$(mktemp -d)"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=hooklab.example.com' \
            -keyout "$certdir/privkey.pem" -out "$certdir/fullchain.pem" >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/ops/nginx-hooklab.conf.example:/etc/nginx/conf.d/hooklab.conf:ro" \
            -v "$certdir:/etc/ssl/hooklab:ro" nginx:stable-alpine nginx -t
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and start private Compose deployment
        run: npm run quickstart
      - name: Seed disposable synthetic event
        run: node scripts/compose-smoke.mjs
      - name: Restore backup to isolated database
        run: npm run backup:verify
      - name: Check portable archive and key fingerprint
        run: npm run backup:inspect -- "$(find backups -maxdepth 1 -name '*.dump' -print -quit)"
      - name: Start app from backup on a fresh database volume
        env:
          COMPOSE_FILE: compose.yaml
          HOOKLAB_PORT: 8788
        run: |
          set -euo pipefail
          archive="$(find backups -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$archive"
          trap 'docker compose -p hooklab_recovery_ci down --volumes' EXIT
          docker compose -p hooklab_recovery_ci up -d --wait database
          schema="$(docker compose -p hooklab_recovery_ci exec -T database psql -U hooklab -d hooklab -At -c "SELECT to_regclass('public.hooklab_schema')")"
          test -z "$schema"
          docker compose -p hooklab_recovery_ci exec -T database pg_restore -U hooklab -d hooklab --exit-on-error --no-owner --no-acl < "$archive"
          docker compose -p hooklab_recovery_ci up -d app
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/health | grep -q '"status":"ok"'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          test "$(docker compose -p hooklab_recovery_ci exec -T database psql -U hooklab -d hooklab -At -c 'SELECT count(*) FROM events')" = '1'
          echo 'Fresh-volume restore booted HookLab and retained the synthetic event.'
      - name: Stop temporary deployment
        if: always()
        run: docker compose down
